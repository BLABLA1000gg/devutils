<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>devutils — Developer Utilities</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <style>
    body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
    textarea { resize: vertical; }
    .tool-btn { transition: all .15s; }
    .tool-btn.active { background: #2563eb; color: #fff; }
    .tool-btn:not(.active) { background: #1e293b; color: #94a3b8; }
    .tool-btn:not(.active):hover { background: #334155; color: #e2e8f0; }
    .copy-btn:hover { background: #334155; }
  </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">

<header class="border-b border-slate-800 px-6 py-4 flex items-center gap-3">
  <svg class="w-5 h-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
  </svg>
  <span class="font-bold text-lg tracking-tight">devutils</span>
  <span class="text-slate-500 text-sm">Developer Utilities</span>
</header>

<div class="flex h-[calc(100vh-57px)]">

  <!-- Sidebar -->
  <nav class="w-48 border-r border-slate-800 p-3 flex flex-col gap-1 shrink-0 overflow-y-auto">
    <p class="text-xs text-slate-600 px-2 pt-1 pb-1 uppercase tracking-wider">Encode / Decode</p>
    <button onclick="setTool('base64')"    id="btn-base64"    class="tool-btn active text-left px-3 py-2 rounded text-sm">Base64</button>
    <button onclick="setTool('url')"       id="btn-url"       class="tool-btn text-left px-3 py-2 rounded text-sm">URL Encode</button>
    <button onclick="setTool('html')"      id="btn-html"      class="tool-btn text-left px-3 py-2 rounded text-sm">HTML Entities</button>
    <p class="text-xs text-slate-600 px-2 pt-3 pb-1 uppercase tracking-wider">Format</p>
    <button onclick="setTool('json')"      id="btn-json"      class="tool-btn text-left px-3 py-2 rounded text-sm">JSON Format</button>
    <button onclick="setTool('yaml2json')" id="btn-yaml2json" class="tool-btn text-left px-3 py-2 rounded text-sm">YAML → JSON</button>
    <button onclick="setTool('json2yaml')" id="btn-json2yaml" class="tool-btn text-left px-3 py-2 rounded text-sm">JSON → YAML</button>
    <p class="text-xs text-slate-600 px-2 pt-3 pb-1 uppercase tracking-wider">Hash</p>
    <button onclick="setTool('hash')"      id="btn-hash"      class="tool-btn text-left px-3 py-2 rounded text-sm">Hash (SHA)</button>
    <p class="text-xs text-slate-600 px-2 pt-3 pb-1 uppercase tracking-wider">Text</p>
    <button onclick="setTool('case')"      id="btn-case"      class="tool-btn text-left px-3 py-2 rounded text-sm">Case Convert</button>
    <button onclick="setTool('diff')"      id="btn-diff"      class="tool-btn text-left px-3 py-2 rounded text-sm">Text Diff</button>
    <button onclick="setTool('lorem')"     id="btn-lorem"     class="tool-btn text-left px-3 py-2 rounded text-sm">Lorem Ipsum</button>
    <p class="text-xs text-slate-600 px-2 pt-3 pb-1 uppercase tracking-wider">Other</p>
    <button onclick="setTool('uuid')"      id="btn-uuid"      class="tool-btn text-left px-3 py-2 rounded text-sm">UUID Generate</button>
    <button onclick="setTool('regex')"     id="btn-regex"     class="tool-btn text-left px-3 py-2 rounded text-sm">Regex Tester</button>
    <button onclick="setTool('ts')"        id="btn-ts"        class="tool-btn text-left px-3 py-2 rounded text-sm">Timestamp</button>
    <button onclick="setTool('jwt')"       id="btn-jwt"       class="tool-btn text-left px-3 py-2 rounded text-sm">JWT Decode</button>
  </nav>

  <main class="flex-1 p-6 overflow-y-auto" id="tool-area"></main>
</div>

<script>
// ── Helpers ───────────────────────────────────────────────────────────────────
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function copyEl(id) { navigator.clipboard.writeText(document.getElementById(id).innerText || ''); }
function setOut(id, text) { document.getElementById(id).innerText = text; }
function getVal(id) { return document.getElementById(id).value; }

// ── Tool logic (all global) ───────────────────────────────────────────────────

// Base64
function b64Encode() { try { setOut('b64-out', btoa(unescape(encodeURIComponent(getVal('b64-in'))))); } catch(e) { setOut('b64-out', 'Error: ' + e.message); } }
function b64Decode() { try { setOut('b64-out', decodeURIComponent(escape(atob(getVal('b64-in'))))); } catch(e) { setOut('b64-out', 'Error: ' + e.message); } }

// URL
function urlEncode() { setOut('url-out', encodeURIComponent(getVal('url-in'))); }
function urlDecode() { try { setOut('url-out', decodeURIComponent(getVal('url-in'))); } catch(e) { setOut('url-out', 'Error: ' + e.message); } }

// HTML entities
function htmlEncode() { const t = document.createElement('textarea'); t.innerText = getVal('html-in'); setOut('html-out', t.innerHTML); }
function htmlDecode() { const t = document.createElement('textarea'); t.innerHTML = getVal('html-in'); setOut('html-out', t.value); }

// JSON
function fmtJson(spaces) { try { setOut('json-out', JSON.stringify(JSON.parse(getVal('json-in')), null, spaces)); } catch(e) { setOut('json-out', 'Error: ' + e.message); } }
function validateJson() { try { JSON.parse(getVal('json-in')); setOut('json-out', '✓ Valid JSON'); } catch(e) { setOut('json-out', '✗ ' + e.message); } }

// YAML ↔ JSON
function yaml2json() { try { setOut('y2j-out', JSON.stringify(jsyaml.load(getVal('y2j-in')), null, 2)); } catch(e) { setOut('y2j-out', 'Error: ' + e.message); } }
function json2yaml() { try { setOut('j2y-out', jsyaml.dump(JSON.parse(getVal('j2y-in')))); } catch(e) { setOut('j2y-out', 'Error: ' + e.message); } }

// Hash
async function doHash(alg) {
  const buf = await crypto.subtle.digest(alg, new TextEncoder().encode(getVal('hash-in')));
  const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  setOut('hash-out', alg + ': ' + hex);
}

// Case convert
function convCase(type) {
  const v = getVal('case-in');
  const words = v.replace(/[_\-]+/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').toLowerCase().split(/\s+/);
  const map = {
    upper: v.toUpperCase(), lower: v.toLowerCase(),
    title: words.map(w => w[0].toUpperCase() + w.slice(1)).join(' '),
    camel: words.map((w,i) => i ? w[0].toUpperCase() + w.slice(1) : w).join(''),
    snake: words.join('_'), kebab: words.join('-'),
    pascal: words.map(w => w[0].toUpperCase() + w.slice(1)).join(''),
  };
  setOut('case-out', map[type] || '');
}

// Text diff
function doDiff() {
  const a = getVal('diff-a').split('\n');
  const b = getVal('diff-b').split('\n');
  const max = Math.max(a.length, b.length);
  let html = '';
  for (let i = 0; i < max; i++) {
    const la = a[i] ?? '', lb = b[i] ?? '';
    if (la === lb) html += `<div class="text-slate-400 py-0.5">&nbsp; ${esc(la)}</div>`;
    else {
      if (la) html += `<div class="text-red-400 bg-red-950/30 py-0.5">- ${esc(la)}</div>`;
      if (lb) html += `<div class="text-green-400 bg-green-950/30 py-0.5">+ ${esc(lb)}</div>`;
    }
  }
  document.getElementById('diff-out').innerHTML = html || '<span class="text-slate-500">No differences</span>';
}

// Lorem ipsum
const LOREM = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.';
function genLorem() { setOut('lorem-out', Array(parseInt(getVal('lorem-n')) || 3).fill(LOREM).join('\n\n')); }

// UUID
function genUuid() { setOut('uuid-out', Array.from({length: parseInt(getVal('uuid-n')) || 5}, () => crypto.randomUUID()).join('\n')); }

// Regex
function doRegex() {
  const pat = getVal('rx-pattern'), flags = getVal('rx-flags'), text = getVal('rx-text');
  try {
    const g = flags.includes('g') ? flags : flags + 'g';
    const matches = [...text.matchAll(new RegExp(pat, g))];
    document.getElementById('rx-status').innerHTML = `<span class="text-green-400">✓ ${matches.length} match${matches.length !== 1 ? 'es' : ''}</span>`;
    document.getElementById('rx-out').innerHTML = text
      .replace(new RegExp(pat, g), m => `<mark class="bg-yellow-500/40 text-yellow-200 rounded px-0.5">${esc(m)}</mark>`)
      .replace(/\n/g, '<br>');
  } catch(e) {
    document.getElementById('rx-status').innerHTML = `<span class="text-red-400">✗ ${e.message}</span>`;
    document.getElementById('rx-out').innerHTML = '';
  }
}

// Timestamp
function convTs() {
  const ts = parseInt(getVal('ts-in'));
  if (isNaN(ts)) { document.getElementById('ts-out').innerHTML = '<div class="px-4 py-3 text-red-400 text-sm">Invalid</div>'; return; }
  const d = new Date(ts * 1000);
  const diff = Math.floor(Date.now() / 1000) - ts;
  const ago = Math.abs(diff) < 60 ? Math.abs(diff) + 's' : Math.abs(diff) < 3600 ? Math.floor(Math.abs(diff)/60) + 'm' : Math.floor(Math.abs(diff)/3600) + 'h';
  const rows = [['UTC', d.toUTCString()], ['ISO 8601', d.toISOString()], ['Local', d.toLocaleString()], ['Date', d.toISOString().split('T')[0]], ['Relative', ago + (diff > 0 ? ' ago' : ' from now')]];
  document.getElementById('ts-out').innerHTML = rows.map(([k,v]) =>
    `<div class="flex justify-between px-4 py-2.5 text-sm border-b border-slate-800 last:border-0"><span class="text-slate-400">${k}</span><span class="font-mono">${v}</span></div>`
  ).join('');
}
function tsNow() { document.getElementById('ts-in').value = Math.floor(Date.now() / 1000); convTs(); }

// JWT
function decodeJwt() {
  const parts = getVal('jwt-in').trim().split('.');
  if (parts.length < 2) { setOut('jwt-header', 'Invalid JWT'); return; }
  try {
    const fix = s => s.replace(/-/g,'+').replace(/_/g,'/');
    const header  = JSON.parse(atob(fix(parts[0])));
    const payload = JSON.parse(atob(fix(parts[1])));
    setOut('jwt-header',  JSON.stringify(header,  null, 2));
    setOut('jwt-payload', JSON.stringify(payload, null, 2));
    if (payload.exp) {
      const exp = new Date(payload.exp * 1000), expired = Date.now() > payload.exp * 1000;
      document.getElementById('jwt-exp').innerHTML = expired
        ? `<span class="text-red-400">✗ Expired: ${exp.toLocaleString()}</span>`
        : `<span class="text-green-400">✓ Valid until: ${exp.toLocaleString()}</span>`;
    }
  } catch(e) { setOut('jwt-header', 'Error: ' + e.message); }
}

// ── HTML templates (no scripts inside) ───────────────────────────────────────
function ta(id, ph='', rows=8, val='') {
  return `<textarea id="${id}" rows="${rows}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm font-mono focus:outline-none focus:border-blue-500 placeholder-slate-600" placeholder="${ph}">${val}</textarea>`;
}
function out(id) {
  return `<div class="relative"><pre id="${id}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm font-mono min-h-[100px] text-slate-200 whitespace-pre-wrap break-all"></pre><button onclick="copyEl('${id}')" class="copy-btn absolute top-2 right-2 bg-slate-800 text-slate-400 text-xs px-2 py-1 rounded transition-colors">copy</button></div>`;
}
function lbl(t) { return `<p class="text-xs text-slate-500 mb-1 mt-3 uppercase tracking-wider">${t}</p>`; }
function btn(label, fn, color='blue') { return `<button onclick="${fn}" class="bg-${color}-600 hover:bg-${color}-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">${label}</button>`; }
function row(...bs) { return `<div class="flex flex-wrap gap-2 my-3">${bs.join('')}</div>`; }
function h(title, desc='') { return `<h2 class="text-lg font-semibold mb-1">${title}</h2>${desc ? `<p class="text-slate-400 text-sm mb-4">${desc}</p>` : '<div class="mb-4"></div>'}`; }
function inp(id, val='', ph='', w='w-24') { return `<input id="${id}" type="text" value="${val}" placeholder="${ph}" class="${w} bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:border-blue-500"/>`; }
function num(id, val, min=1, max=50, w='w-24') { return `<input id="${id}" type="number" value="${val}" min="${min}" max="${max}" class="${w} bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500"/>`; }

const tools = {
  base64:   () => h('Base64','Encode or decode Base64 strings') + lbl('Input') + ta('b64-in','Enter text or Base64...') + row(btn('Encode →','b64Encode()'), btn('← Decode','b64Decode()','slate')) + lbl('Output') + out('b64-out'),
  url:      () => h('URL Encode / Decode') + lbl('Input') + ta('url-in','https://example.com/path?q=hello world',4) + row(btn('Encode','urlEncode()'), btn('Decode','urlDecode()','slate')) + lbl('Output') + out('url-out'),
  html:     () => h('HTML Entity Encode / Decode') + lbl('Input') + ta('html-in','<div class="test">Hello & goodbye</div>',4) + row(btn('Encode','htmlEncode()'), btn('Decode','htmlDecode()','slate')) + lbl('Output') + out('html-out'),
  json:     () => h('JSON Formatter','Format and validate JSON') + lbl('Input') + ta('json-in','{"name":"Alice","age":30}') + row(btn('Format','fmtJson(2)'), btn('Compact','fmtJson(0)','slate'), btn('Validate','validateJson()','green')) + lbl('Output') + out('json-out'),
  yaml2json:() => h('YAML → JSON') + lbl('YAML Input') + ta('y2j-in','name: Alice\nage: 30\nhobbies:\n  - reading\n  - coding') + row(btn('Convert','yaml2json()')) + lbl('JSON Output') + out('y2j-out'),
  json2yaml:() => h('JSON → YAML') + lbl('JSON Input') + ta('j2y-in','{"name":"Alice","age":30}') + row(btn('Convert','json2yaml()')) + lbl('YAML Output') + out('j2y-out'),
  hash:     () => h('Hash Generator','SHA-1 / SHA-256 / SHA-512 via WebCrypto API') + lbl('Input') + ta('hash-in','Enter text to hash...',4) + row(btn('SHA-256',"doHash('SHA-256')"), btn('SHA-512',"doHash('SHA-512')",'slate'), btn('SHA-1',"doHash('SHA-1')",'slate')) + lbl('Output') + out('hash-out'),
  case:     () => h('Case Converter') + lbl('Input') + ta('case-in','hello world from devutils',3) + row(btn('UPPER',"convCase('upper')"), btn('lower',"convCase('lower')",'slate'), btn('Title',"convCase('title')",'slate'), btn('camelCase',"convCase('camel')",'slate')) + row(btn('snake_case',"convCase('snake')",'slate'), btn('kebab-case',"convCase('kebab')",'slate'), btn('PascalCase',"convCase('pascal')",'slate')) + lbl('Output') + out('case-out'),
  diff:     () => h('Text Diff','Compare two texts line by line') + `<div class="grid grid-cols-2 gap-3">${lbl('Text A') + ta('diff-a','foo\nbar\nbaz',8)}${lbl('Text B') + ta('diff-b','foo\nqux\nbaz',8)}</div>` + row(btn('Compare','doDiff()')) + lbl('Result') + `<div id="diff-out" class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 font-mono text-sm min-h-[80px]"></div>`,
  lorem:    () => h('Lorem Ipsum Generator') + `<div class="flex gap-3 items-end">${lbl('Paragraphs') + num('lorem-n',3,1,20)}${btn('Generate','genLorem()')}</div>` + lbl('Output') + out('lorem-out'),
  uuid:     () => h('UUID Generator') + `<div class="flex gap-3 items-end">${lbl('Count') + num('uuid-n',5,1,50)}${btn('Generate','genUuid()')}</div>` + lbl('UUIDs') + out('uuid-out'),
  regex:    () => h('Regex Tester') + `<div class="flex gap-2">${lbl('Pattern') + inp('rx-pattern','\\b\\w{4}\\b','pattern...','flex-1')}${lbl('Flags') + inp('rx-flags','gi','gi','w-20')}</div>` + lbl('Test String') + ta('rx-text','The quick brown fox jumps over the lazy dog.',4) + row(btn('Test','doRegex()')) + `<div id="rx-status" class="text-sm mb-2"></div>` + lbl('Highlighted') + `<div id="rx-out" class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 font-mono text-sm min-h-[60px] break-all"></div>`,
  ts:       () => h('Timestamp Converter') + `<div class="flex gap-3 items-end">${lbl('Unix Timestamp') + inp('ts-in', Math.floor(Date.now()/1000), '', 'w-48')}${btn('Convert','convTs()')}${btn('Now','tsNow()','slate')}</div>` + lbl('Result') + `<div id="ts-out" class="bg-slate-900 border border-slate-700 rounded-xl divide-y divide-slate-800"></div>`,
  jwt:      () => h('JWT Decoder','Decode JWT tokens client-side — nothing leaves your machine') + lbl('JWT Token') + ta('jwt-in','Paste your JWT here...',4) + row(btn('Decode','decodeJwt()')) + `<div class="grid grid-cols-2 gap-3">${lbl('Header') + out('jwt-header')}${lbl('Payload') + out('jwt-payload')}</div>` + `<div id="jwt-exp" class="mt-2 text-sm"></div>`,
};

// ── Tab switching ─────────────────────────────────────────────────────────────
function setTool(name) {
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('btn-' + name);
  if (btn) btn.classList.add('active');
  document.getElementById('tool-area').innerHTML = (tools[name] || (() => ''))();
  // Auto-run tools that produce output immediately
  if (name === 'lorem') genLorem();
  if (name === 'uuid')  genUuid();
  if (name === 'ts')    convTs();
  if (name === 'regex') doRegex();
}

setTool('base64');
</script>
</body>
</html>
